<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>StayFast synthetic feed playback</title>
    <style>
      body {
        margin: 0;
        background: #f3f7fa;
        color: #123;
        font: 16px system-ui;
      }
      h1 {
        font-size: 24px;
        margin: 16px;
      }
      .older {
        height: 220px;
      }
      video {
        display: block;
        width: 330px;
        max-width: 100%;
        aspect-ratio: 16/9;
      }
      .lead {
        height: 640px;
      }
      #feed-slot {
        height: 260px;
        margin-left: 16px;
      }
      .tail {
        height: 1400px;
      }
      .actions {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 2147483646;
        display: grid;
        grid-template-columns: repeat(2, 130px);
        gap: 4px;
      }
      button {
        font: 14px system-ui;
        min-height: 44px;
      }
      #feed-status,
      pre {
        margin: 16px;
        font: 12px/1.3 monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <h1>Synthetic feed</h1>
    <div class="older">
      <video
        id="older-video"
        aria-label="Older video"
        muted
        loop
        playsinline
        controls
        preload="auto"
        src="/sample.mp4?older"
      ></video>
    </div>
    <div class="lead" aria-hidden="true"></div>
    <div id="feed-slot"></div>
    <p id="feed-status" role="status">Feed status: loading</p>
    <pre id="feed-trace">Feed trace: []</pre>
    <div class="tail"></div>
    <div class="actions">
      <button id="prepare">Prepare feed baseline</button
      ><button id="next">Load next feed video</button
      ><button id="autoplay">Load next autoplay video</button
      ><button id="reuse">Replace source and play</button
      ><button id="pause">Pause feed video</button
      ><button id="seed">Prepare controlled feed</button>
    </div>
    <script>
      const older = document.querySelector('#older-video');
      const slot = document.querySelector('#feed-slot');
      const status = document.querySelector('#feed-status');
      const trace = document.querySelector('#feed-trace');
      let current = null;
      let generation = 0;
      let baseline = null;
      let mode = 'initial';
      let requestError = 'none';
      const errors = [];
      const records = [];
      const nativeBegins = new WeakMap();
      function record(event, video = current) {
        records.push({
          t: Math.round(performance.now()),
          event,
          visibility: document.visibilityState,
          source: video?.currentSrc || video?.src,
          id: video?.id,
          inline: video?.hasAttribute('playsinline'),
          webkitInline: video?.hasAttribute('webkit-playsinline'),
          controller: !!video?.vsc,
          ready: video?.readyState,
          paused: video?.paused,
          native: video?.webkitDisplayingFullscreen === true,
          scroll: [scrollX, scrollY],
        });
        if (records.length > 100) records.shift();
        update();
      }
      function update() {
        const v = current;
        const text =
          'Feed status: older controller: ' +
          !!older.vsc +
          '; generation: ' +
          generation +
          '; mode: ' +
          mode +
          '; feed controller: ' +
          !!v?.vsc +
          '; controllers: ' +
          document.querySelectorAll('vsc-controller').length +
          '; feed id: ' +
          (v?.id || 'none') +
          '; ready: ' +
          (v?.readyState ?? 0) +
          '; paused: ' +
          (v?.paused ?? true) +
          '; time: ' +
          (v?.currentTime ?? 0).toFixed(2) +
          '; plays inline: ' +
          !!v?.hasAttribute('playsinline') +
          '; webkit inline: ' +
          !!v?.hasAttribute('webkit-playsinline') +
          '; native fullscreen: ' +
          (v?.webkitDisplayingFullscreen === true || v?.webkitPresentationMode === 'fullscreen') +
          '; native begins: ' +
          (nativeBegins.get(v) || 0) +
          '; owner active: ' +
          !!v?.vsc?.iosPlayer?.active +
          '; owned hosts: ' +
          document.querySelectorAll('vsc-ios-player').length +
          '; page scroll: ' +
          scrollX +
          ',' +
          scrollY +
          '; saved scroll: ' +
          (baseline ? baseline.join(',') : 'none') +
          '; video top: ' +
          (v?.getBoundingClientRect().top ?? 0).toFixed(1) +
          '; request error: ' +
          requestError +
          '; media error: ' +
          (v?.error?.code || 0) +
          '; errors: ' +
          errors.length;
        if (status.textContent !== text) status.textContent = text;
        const history = 'Feed trace: ' + JSON.stringify(records);
        if (trace.textContent !== history) trace.textContent = history;
        for (const host of document.querySelectorAll('vsc-ios-player')) {
          const dialog = host.shadowRoot?.querySelector('dialog');
          if (!dialog) continue;
          let item = dialog.querySelector('#feed-owned-status');
          if (!item) {
            item = document.createElement('p');
            item.id = 'feed-owned-status';
            item.setAttribute('role', 'status');
            item.style.cssText =
              'position:absolute;top:70px;left:6px;right:6px;font:10px monospace;color:white;pointer-events:none;z-index:50';
            dialog.append(item);
          }
          if (item.textContent !== text) item.textContent = text;
          if (!dialog.querySelector('#feed-recycle-active')) {
            const action = document.createElement('button');
            action.id = 'feed-recycle-active';
            action.textContent = 'Recycle active feed source';
            action.style.cssText =
              'position:absolute;top:170px;left:16px;min-height:44px;font:14px system-ui;z-index:60';
            action.addEventListener('click', (event) => {
              if (!event.isTrusted || !current) return;
              event.stopPropagation();
              mode = 'active-source-recycle';
              current.src = '/sample.mp4?active-recycle=' + ++generation;
              record('active-source-replaced');
            });
            dialog.append(action);
          }
        }
      }
      function track(video) {
        nativeBegins.set(video, 0);
        for (const type of [
          'loadstart',
          'loadedmetadata',
          'loadeddata',
          'canplay',
          'play',
          'playing',
          'pause',
          'emptied',
          'webkitbeginfullscreen',
          'webkitendfullscreen',
          'webkitpresentationmodechanged',
          'error',
        ])
          video.addEventListener(type, () => {
            if (type === 'webkitbeginfullscreen')
              nativeBegins.set(video, (nativeBegins.get(video) || 0) + 1);
            record(type, video);
          });
        video.addEventListener('timeupdate', update);
        new MutationObserver((records) => {
          for (const item of records) record('attribute:' + item.attributeName, video);
        }).observe(video, {
          attributes: true,
          attributeFilter: ['playsinline', 'webkit-playsinline'],
        });
      }
      function requestPlay(video) {
        record('before-play', video);
        try {
          const result = video.play();
          record('after-play-request', video);
          result
            ?.then(() => record('play-resolved', video))
            .catch((error) => {
              requestError = error.name + ':' + error.message;
              record('play-rejected', video);
            });
        } catch (error) {
          requestError = error.name + ':' + error.message;
          record('play-threw', video);
        }
      }
      function appendVideo(autoplay = false, play = true) {
        mode = autoplay
          ? 'scheduled-muted-autoplay'
          : play
            ? 'synchronous-append-play'
            : 'controlled-seed';
        requestError = 'none';
        const video = document.createElement('video');
        video.id = 'feed-video-' + ++generation;
        video.setAttribute('aria-label', 'Feed video');
        video.muted = true;
        video.loop = true;
        video.controls = true;
        video.preload = 'auto';
        video.autoplay = autoplay;
        track(video);
        current = video;
        record('before-append', video);
        slot.replaceChildren(video);
        video.src = '/sample.mp4?feed=' + generation;
        record('source-assigned', video);
        if (play) requestPlay(video);
        else record('autoplay-or-seed-armed', video);
      }
      for (const type of ['pagehide', 'pageshow', 'visibilitychange']) {
        addEventListener(type, () => record(type), true);
      }
      track(older);
      document.querySelector('#prepare').addEventListener('click', (event) => {
        if (!event.isTrusted) return;
        scrollTo({ left: 0, top: 720, behavior: 'instant' });
        baseline = [scrollX, scrollY];
        record('baseline');
      });
      document.querySelector('#next').addEventListener('click', (event) => {
        if (event.isTrusted) appendVideo();
      });
      document.querySelector('#autoplay').addEventListener('click', (event) => {
        if (!event.isTrusted) return;
        mode = 'autoplay-scheduled';
        record('schedule-autoplay');
        setTimeout(() => appendVideo(true, false), 6000);
      });
      document.querySelector('#seed').addEventListener('click', (event) => {
        if (event.isTrusted) appendVideo(false, false);
      });
      document.querySelector('#reuse').addEventListener('click', (event) => {
        if (!event.isTrusted || !current) return;
        mode = 'same-node-source-reuse';
        requestError = 'none';
        current.removeAttribute('playsinline');
        current.removeAttribute('webkit-playsinline');
        current.src = '/sample.mp4?reuse=' + ++generation;
        record('source-replaced');
        requestPlay(current);
      });
      document.querySelector('#pause').addEventListener('click', (event) => {
        if (event.isTrusted) current?.pause();
      });
      addEventListener('scroll', update, true);
      addEventListener('error', (event) => {
        errors.push(event.message);
        record('page-error');
      });
      addEventListener('unhandledrejection', (event) => {
        errors.push(String(event.reason));
        record('unhandled-rejection');
      });
      new MutationObserver(update).observe(document.body, { childList: true });
      new MutationObserver(update).observe(slot, { childList: true, subtree: true });
      update();
    </script>
  </body>
</html>
