<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>StayFast HLS player verification</title>
  <style>
    body {
      margin: 0;
      background: #f4f6f8;
      font: 15px system-ui;
    }
    .spacer {
      height: 640px;
    }
    .tail {
      height: 1200px;
    }
    #player {
      margin: 0 16px;
      width: 340px;
      max-width: calc(100vw - 32px);
    }
    video {
      width: 100%;
      aspect-ratio: 16/9;
    }
    .actions {
      position: fixed;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      gap: 8px;
      z-index: 2147483646;
    }
    button {
      font: inherit;
      min-height: 44px;
      flex: 1;
    }
    #state {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      font-size: 11px;
      max-height: 180px;
      overflow: auto;
      z-index: 2147483646;
    }
  </style>
  <div class="spacer"></div>
  <div id="player"></div>
  <div class="tail"></div>
  <div class="actions">
    <button id="prepare" disabled>Prepare player</button
    ><button id="speed" disabled>Set 4x playback</button>
  </div>
  <p id="state" role="status">HLS player: loading</p>
  <script>
    const params = new URLSearchParams(location.search);
    const provider = params.get('provider') || 'html';
    const ownedMode = params.has('owned');
    const HLS =
      'https://video.twimg.com/amplify_video/2041611432752742400/pl/OJFA7eAdt1CV9YgM.m3u8?tag=21&v=87a';
    const MP4 =
      'https://video.twimg.com/amplify_video/2041611432752742400/vid/avc1/1920x1080/oK7YYmqZfrOjsrWa.mp4?tag=21';
    const errors = [],
      host = document.querySelector('#player'),
      status = document.querySelector('#state');
    let video,
      original,
      baseline,
      candidate,
      commandTime,
      sourceBefore,
      phase = 'loading',
      cadence,
      diagnostic,
      publisher,
      declaredTracks,
      retainedTrack,
      retainedMode,
      retainedCues;
    const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    addEventListener('error', (e) => {
      errors.push(e.message);
      draw();
    });
    addEventListener('unhandledrejection', (e) => {
      errors.push(String(e.reason));
      draw();
    });
    function draw() {
      const report = {
        provider,
        ownedMode,
        phase,
        sameNode: video === original,
        controlled: !!video?.vsc,
        nativeHLS: !!sourceBefore && sourceBefore.includes('.m3u8'),
        mp4: !!candidate && video?.currentSrc === candidate.progressiveUrl,
        selected: candidate?.provider,
        rate: video?.playbackRate,
        paused: video?.paused,
        time: video?.currentTime,
        commandTime,
        scroll: [scrollX, scrollY],
        baseline,
        native: !!video?.webkitDisplayingFullscreen,
        owned: !!video?.vsc?.iosPlayer?.active,
        cadence,
        diagnostic,
        programmaticTrackPreserved:
          !retainedTrack ||
          (publisher?.proxyTracks_?.media?.track_ === retainedTrack &&
            Array.from(video.textTracks).includes(retainedTrack) &&
            retainedTrack.mode === retainedMode &&
            retainedCues.every((c) => Array.from(retainedTrack.cues).includes(c))),
        metadataPreserved: !declaredTracks || publisher?.mediainfo?.text_tracks === declaredTracks,
        errors,
      };
      const text = 'HLS player: ' + JSON.stringify(report);
      status.textContent = text;
      const player = video?.vsc?.iosPlayer;
      if (player?.active) {
        let copy = player.ui.shadow.querySelector('#hls-fixture-state');
        if (!copy) {
          copy = document.createElement('p');
          copy.id = 'hls-fixture-state';
          copy.style.cssText =
            'position:absolute;top:55px;left:8px;right:8px;font-size:10px;background:white;color:black;z-index:100;max-height:125px;overflow:auto';
          player.ui.shadow.querySelector('dialog').append(copy);
        }
        copy.textContent = text;
      }
    }
    function script(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(Error('Player SDK unavailable'));
        document.head.append(s);
      });
    }
    async function makePlayer() {
      if (provider === 'html') {
        video = document.createElement('video');
        video.controls = true;
        video.muted = true;
        video.playsInline = true;
        video.preload = 'auto';
        for (const [src, type] of [
          [HLS, 'application/vnd.apple.mpegurl'],
          [MP4, 'video/mp4'],
        ]) {
          const source = document.createElement('source');
          source.src = src;
          source.type = type;
          video.append(source);
        }
        host.append(video);
      } else if (provider === 'videojs') {
        const shell = document.createElement('video-js');
        shell.id = 'brightcove-fixture';
        for (const [key, value] of Object.entries({
          'data-account': '1752604059001',
          'data-player': 'default',
          'data-embed': 'default',
          'data-video-id': '5842800655001',
          controls: '',
          playsinline: '',
        }))
          shell.setAttribute(key, value);
        host.append(shell);
        await script('https://players.brightcove.net/1752604059001/default_default/index.min.js');
      } else if (provider === 'jwplayer') {
        const shell = document.createElement('div');
        shell.id = 'jw-fixture';
        host.append(shell);
        await script('https://cdn.jwplayer.com/libraries/v2VOXzX8.js');
        jwplayer(shell.id).setup({
          width: '100%',
          aspectratio: '16:9',
          autostart: false,
          mute: true,
          playlist: [
            {
              sources: [
                { file: HLS, type: 'hls' },
                { file: MP4, type: 'mp4', label: '1080p' },
              ],
            },
          ],
        });
      } else throw Error('Unknown player');
      const deadline = performance.now() + 20000;
      await new Promise((resolve, reject) => {
        const ready = () => {
          video = host.querySelector('video');
          if (video?.vsc) return resolve();
          if (performance.now() > deadline) return reject(Error('Player/controller unavailable'));
          requestAnimationFrame(ready);
        };
        ready();
      });
      original = video;
      video.loop = true;
      video.muted = true;
      video.playsInline = true;
      video.addEventListener('error', () => {
        errors.push('Media error ' + video.error?.code);
        draw();
      });
      phase = 'ready';
      document.querySelector('#prepare').disabled = false;
      draw();
    }
    function frame() {
      return new Promise((resolve, reject) => {
        let token;
        const timeout = setTimeout(() => {
          video.cancelVideoFrameCallback(token);
          reject(Error('No presented frame'));
        }, 15000);
        token = video.requestVideoFrameCallback(() => {
          clearTimeout(timeout);
          resolve();
        });
      });
    }
    const deadline = performance.now() + 12000;
    (function ready() {
      if (window.VSC?.SafariHLSPlayback && window.VSC_controller?.actionHandler) {
        window.VSC_controller.config.settings.lastSpeed = 1;
        window.VSC_controller.config.settings.siteDefaultSpeed = null;
        makePlayer().catch((e) => {
          errors.push(String(e));
          draw();
        });
      } else if (performance.now() < deadline) requestAnimationFrame(ready);
      else {
        errors.push('Extension unavailable');
        draw();
      }
    })();
    document.querySelector('#prepare').onclick = async () => {
      try {
        await video.play();
        await frame();
        video.vsc.actionHandler.setSpeed(video, 1, 'user');
        video.currentTime = 1;
        await frame();
        sourceBefore = video.currentSrc;
        candidate = window.VSC.ProgressiveMediaSource.findCandidate(video);
        const scope = video.closest('.video-js,.jwplayer');
        const sdk = scope && window.videojs?.getPlayer?.(scope.id);
        publisher = sdk;
        declaredTracks = sdk?.mediainfo?.text_tracks;
        retainedTrack = sdk?.proxyTracks_?.media?.track_;
        if (retainedTrack) {
          retainedTrack.addCue(new VTTCue(0, video.duration, 'StayFast fixture metadata'));
          retainedMode = retainedTrack.mode;
          retainedCues = Array.from(retainedTrack.cues);
        }
        const jw = scope && typeof window.jwplayer === 'function' && window.jwplayer(scope.id);
        const item = jw?.getPlaylistItem?.();
        diagnostic = {
          jw: item && {
            sameContainer: jw.getContainer() === scope,
            keys: Object.keys(item),
            tracks: item.tracks,
            protected: ['drm', 'ssai', 'live', 'streamtype'].map((k) => [k, !!item[k]]),
            sources: item.sources?.map((s) => ({
              type: s.type,
              match: s.file === video.currentSrc,
              keys: Object.keys(s),
              scheme: new URL(s.file, location.href).protocol,
            })),
          },
          direct: video.src === video.currentSrc,
          sourceCount: video.children.length,
          scope: scope?.id,
          sdk: !!sdk,
          sameElement: sdk?.el?.() === scope,
          ads: [sdk?.ads?.isInAdMode?.(), sdk?.ads?.inAdBreak?.()],
          tracks: Array.from(video.textTracks, (t) => ({
            kind: t.kind,
            label: t.label,
            language: t.language,
            external: Array.from(video.querySelectorAll('track')).some((el) => el.track === t),
            dispatch: t.inBandMetadataTrackDispatchType,
          })),
          sdkTracks: sdk?.mediainfo?.text_tracks?.map((t) => ({
            kind: t.kind,
            label: t.label,
            external: !!t.src,
          })),
          sources: sdk?.currentSources?.()?.map((s) => ({
            type: s.type,
            match: s.src === video.currentSrc,
            scheme: new URL(s.src, location.href).protocol,
            hls: /m3u8/.test(s.src),
            mp4: /mp4/.test(s.src),
            keys: Object.keys(s),
          })),
        };
        scrollTo(0, 440);
        baseline = [scrollX, scrollY];
        phase = 'prepared';
        document.querySelector('#speed').disabled = false;
        draw();
      } catch (e) {
        errors.push(String(e));
        draw();
      }
    };
    document.addEventListener('click', () => setTimeout(draw, 0), true);
    document.querySelector('#speed').onclick = async () => {
      try {
        if (ownedMode) video.vsc.iosPlayer.open();
        commandTime = video.currentTime;
        video.vsc.actionHandler.setSpeed(video, 4, 'user');
        await frame();
        await delay(500);
        const start = performance.now(),
          time = video.currentTime;
        let count = 0,
          token;
        const tick = () => {
          count++;
          token = video.requestVideoFrameCallback(tick);
        };
        token = video.requestVideoFrameCallback(tick);
        await delay(3000);
        video.cancelVideoFrameCallback(token);
        const seconds = (performance.now() - start) / 1000;
        cadence = { hz: count / seconds, progress: (video.currentTime - time) / seconds };
        phase = 'measured';
        draw();
      } catch (e) {
        errors.push(String(e));
        draw();
      }
    };
  </script>
</html>
