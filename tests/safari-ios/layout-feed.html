<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Native transformed feed geometry diagnostic</title>
<style>
  body {
    margin: 0;
    font: 14px system-ui;
  }
  .lead,
  .tail {
    height: 900px;
  }
  #viewport {
    height: 500px;
    overflow: auto;
    position: relative;
    background: #ddd;
  }
  #content {
    position: relative;
    min-height: 4000px;
    width: 650px;
  }
  #far-cell {
    position: absolute;
    top: 0;
    left: 0;
    transform: translate3d(0, 2800px, 0);
    display: flex;
    flex-direction: column;
    width: 330px;
  }
  video {
    width: 330px;
    height: auto;
  }
  #actions {
    position: fixed;
    top: 50px;
    left: 4px;
    z-index: 999999;
  }
  button {
    min-height: 44px;
    font: 16px system-ui;
  }
  #diagnostics {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 150px;
    overflow: auto;
    z-index: 999999;
    background: white;
  }
  textarea {
    width: 95%;
    height: 70px;
    font-size: 12px;
  }
</style>
<div class="lead"></div>
<div id="viewport">
  <div id="content">
    <div id="far-cell"><video id="layout-video" muted controls preload="auto"></video></div>
  </div>
</div>
<div class="tail"></div>
<div id="actions">
  <button id="prepare">Prepare layout baseline</button
  ><button id="load">Load offscreen video</button>
</div>
<div id="diagnostics">
  <div id="status" role="status">Layout status: starting</div>
  <textarea aria-label="Layout event trace" readonly></textarea>
</div>
<script>
  const video = document.querySelector('video');
  const viewport = document.querySelector('#viewport');
  const cell = document.querySelector('#far-cell');
  const trace = [];
  let errors = 0,
    inserted = false,
    nativeBegins = 0;
  const round = (n) => Math.round(n * 100) / 100;
  function sample(event) {
    const host = cell.querySelector('vsc-controller');
    const inner = host?.shadowRoot?.querySelector('#controller');
    const media = video.getBoundingClientRect(),
      control = inner?.getBoundingClientRect();
    const active = document.activeElement;
    trace.push({
      event,
      t: round(performance.now()),
      page: [scrollX, scrollY],
      nested: [viewport.scrollLeft, viewport.scrollTop],
      scrollHeight: viewport.scrollHeight,
      documentHeight: document.documentElement.scrollHeight,
      videoTop: round(media.top),
      videoHeight: round(media.height),
      controllerTop: control ? round(control.top) : null,
      controllerHeight: control ? round(control.height) : null,
      top: inner?.style.top,
      left: inner?.style.left,
      transform: inner?.style.transform,
      focus: active?.tagName + '#' + (active?.id || ''),
      ready: video.readyState,
      inline: video.playsInline,
      native: !!video.webkitDisplayingFullscreen,
      nativeBegins,
      errors,
    });
    if (trace.length > 80) trace.shift();
    document.querySelector('textarea').value = JSON.stringify(trace);
    document.querySelector('#status').textContent =
      `Layout status: inserted: ${inserted}; ready: ${video.readyState}; page: ${scrollX},${scrollY}; nested: ${viewport.scrollLeft},${viewport.scrollTop}; height: ${viewport.scrollHeight}; errors: ${errors}; native begins: ${nativeBegins}`;
  }
  document.querySelector('#prepare').onclick = () => {
    scrollTo(0, 720);
    viewport.scrollTo(70, 650);
    sample('prepared');
  };
  document.querySelector('#load').onclick = () => {
    sample('before-load');
    video.src = '/sample.mp4?layout=' + Date.now();
    video.load();
    sample('after-load');
  };
  const observer = new MutationObserver(() => {
    if (!inserted && cell.querySelector('vsc-controller')) {
      inserted = true;
      sample('controller-inserted');
      requestAnimationFrame(() => {
        sample('first-frame');
        requestAnimationFrame(() => sample('second-frame'));
      });
    }
  });
  observer.observe(cell, { childList: true, subtree: true });
  for (const name of ['loadedmetadata', 'loadeddata', 'canplay', 'loadstart'])
    video.addEventListener(name, () => sample('site-' + name));
  video.addEventListener('webkitbeginfullscreen', () => {
    nativeBegins++;
    sample('native-begin');
  });
  for (const name of ['focusin', 'focusout']) document.addEventListener(name, () => sample(name));
  addEventListener('error', () => {
    errors++;
    sample('error');
  });
  addEventListener('unhandledrejection', () => {
    errors++;
    sample('rejection');
  });
  new ResizeObserver(() => sample('fixture-resize-observer')).observe(video);
  sample('initial');
</script>
