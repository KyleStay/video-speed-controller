name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Lint, Build, Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build:release:chrome
      - run: npm test
      - run: npm run package:chrome

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stayfast-video-chrome-node-${{ matrix.node-version }}
          path: release/stayfast-video-chrome-*.zip
          retention-days: 7
