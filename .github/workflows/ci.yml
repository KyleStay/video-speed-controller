name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint, Build, Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build:release:browsers
      - run: npm test
      - run: xvfb-run -a node tests/e2e/run-browser-fixtures.js chrome
      - run: mkdir -p test-results && xvfb-run -a node tests/e2e/run-performance-benchmark.js
        env:
          STAYFAST_BENCHMARK_OUTPUT: test-results/performance.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stayfast-performance-node-${{ matrix.node-version }}
          path: test-results/performance.json
          if-no-files-found: warn
          retention-days: 7
      - run: npx puppeteer browsers install firefox
      - run: node tests/e2e/run-browser-fixtures.js firefox
      - run: node scripts/package-release.js --all
      - run: xvfb-run -a npm run test:e2e -- basic

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stayfast-video-browsers-node-${{ matrix.node-version }}
          path: release/stayfast-video-*.zip
          retention-days: 7
